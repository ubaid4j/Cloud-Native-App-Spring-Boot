#------------------------Config Client--------------------------#
#spring.config.import=optional:configserver:http://config:8888
#spring.cloud.config.profile=dev
#spring.cloud.config.fail-fast=true
#spring.cloud.config.request-connect-timeout=30000
#spring.cloud.config.request-read-timeout=360000

spring:
  cloud:
    gateway:
      routes:
        - id: task-service
          uri: http://localhost:10191
          predicates:
            - Path=/task-service/**
          filters:
            - RewritePath=/task-service/(?<segment>.*), /${segment}
        - id: frontend-route
          uri: http://localhost:4200
          predicates:
            - Path=/**