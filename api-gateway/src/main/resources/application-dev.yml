server:
  port: 40000

logging:
  level:
    root: debug
    web: DEBUG
    'dev.ubaid': DEBUG
    'org.springframework.cloud': DEBUG
    
spring:
  cloud:
    gateway:
      routes:
        - id: no-ops
          uri: no://op
          predicates:
            - Path=/management/**
          filters:
            - name: SetStatus
              args:
                status: 404
        - id: spa-route
          uri: http://localhost:4200
          predicates:
            - Path=/**
  docker:
    compose:
      file: api-gateway/compose.yml
      start:
        skip: never
      lifecycle-management: start_only