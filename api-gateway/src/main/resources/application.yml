management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  show-actuator: true

#----------------------------App Props---------------------------------------------#
spring:
  application:
    name: api-gateway
  profiles:
    active: #spring.profiles.active#  
    default: dev   
  cloud:
    consul:
      discovery:
#        catalog-services-watch-delay: 60000
        health-check-path: /management/health
#        health-check-interval: 60s
    gateway:
      discovery:
        locator:
          enabled: true