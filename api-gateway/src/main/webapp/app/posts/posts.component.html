<div
        class="search-results"
        infiniteScroll
        [infiniteScrollDistance]="1"
        [infiniteScrollThrottle]="500"
        (scrolled)="onScroll()"
>
    <div class="data-card" *ngFor="let post of posts">
        <app-post 
                [header]="post.title" 
                [content]="post.postDetail.content"
                [createdBy]="post.createdBy"
        />
    </div>

    <div *ngIf="isLoading">Loading...</div>
</div>
