<div class="kanban-column">
    <div class="column-header">
        <h3 class="column-title">{{status | titlecase}}</h3>
        <span class="task-count">{{ getTaskSize() }} tasks</span>
    </div>
    <div
        class="column-content"
        pDroppable="todo"
        (onDrop)="onDrop($event)">
        <app-task *ngFor="let task of getTasks()" [task]="task"></app-task>
    </div>
</div>
