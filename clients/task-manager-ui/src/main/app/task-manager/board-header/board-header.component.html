<div class="board-header">
    <h2 class="board-title">Task Board</h2>
    <button
        class="add-task-btn"
        (click)="showAddTaskDialog = true">
        Add Task
    </button>
</div>
<app-add-task [isVisible]="showAddTaskDialog" (onCloseAddTaskComponent)="closeAddTaskDialog()"></app-add-task>
