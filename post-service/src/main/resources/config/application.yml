management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  show-actuator: true

spring:
  profiles:
    active: dev
  application:
    name: post-service
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc://postgresql://localhost:41001/postservice
    username: postservice
    password: changeme
    hikari:
      pool-name: Hikari
      auto-commit: false
  liquibase:
    contexts: dev
    change-log: classpath:config/liquibase/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      'hibernate.format_sql': true
  cloud:
    consul:
      discovery:
#        catalog-services-watch-delay: 60000
        health-check-path: /management/health
#        health-check-interval: 60s